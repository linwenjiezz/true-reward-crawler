plugins {
    id 'com.android.application'
    id 'com.chaquo.python'      // 内嵌 Python 运行时，手机本机执行采集管线
}

android {
    namespace 'com.linwe.gameradar'
    compileSdk 34

    defaultConfig {
        applicationId "com.linwe.gameradar"
        minSdk 24          // 覆盖 Android 7.0 及以上
        targetSdk 34
        versionCode 2
        versionName "2.0"

        python {
            version "3.11"   // Chaquopy 内嵌的 Python 版本
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 采集管线为纯 Python 标准库，无 pip 依赖
dependencies {}
