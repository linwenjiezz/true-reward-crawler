name: 活动雷达定时采集

# 每小时自动采集一次；也支持在 Actions 页面手动触发
on:
  schedule:
    - cron: '23 * * * *'   # 每小时第 23 分钟（UTC，即北京时间每小时的 :23 左右）
  workflow_dispatch: {}

permissions:
  contents: write          # 允许把新数据提交回仓库
  pages: write             # 允许发布 GitHub Pages
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 三渠道采集 + 生成看板
        run: python 云采集雷达.py

      - name: 把新数据提交回仓库（留档）
        run: |
          git config user.name  "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "雷达数据更新 $(date -u '+%Y-%m-%d %H:%M') UTC" && git push)

      - name: 组装站点（radar_board.html 作为首页）
        run: |
          mkdir -p _site
          cp assets/radar_board.html _site/index.html

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
