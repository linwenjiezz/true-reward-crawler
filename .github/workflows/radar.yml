name: 活动雷达定时采集

# 定时策略（cron 为 UTC；北京时间 = UTC+8）：
#   常规巡逻：北京时间每小时 :01 采一次（01:01~23:01，00 点那一小时由下方蹲守任务接管）
#   0点蹲守：北京时间 23:30 唤醒「整点蹲守雷达.py」，进程内 sleep_until 盯钟到
#            00:00:05 / 00:01:00 / 00:05:30 执行 5 连采（3 探测 + 2 完整）
#   注意：GitHub 定时任务在高负载（尤其午夜）会排队延迟，故唤醒提前到 23:30 留足缓冲；
#         秒级精度由蹲守脚本内部 sleep_until 实现。极限延迟请用 probe.yml 量化。
on:
  schedule:
    - cron: '1 0-15,17-23 * * *'   # 北京时间 01:01~23:01 每小时一次
    - cron: '30 15 * * *'          # 北京时间 23:30 唤醒 0 点蹲守（提前留缓冲吸收 GitHub 排队抖动）
  workflow_dispatch: {}            # 手动触发 = 立即完整采集一次

permissions:
  contents: write          # 允许把新数据提交回仓库
  pages: write             # 允许发布 GitHub Pages
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 三渠道采集 + 生成看板
        run: python 云采集雷达.py

      - name: 把新数据提交回仓库（留档）
        run: |
          git config user.name  "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "雷达数据更新 $(date -u '+%Y-%m-%d %H:%M') UTC" && git push)

      - name: 组装站点（radar_board.html 作为首页）
        run: |
          mkdir -p _site
          cp assets/radar_board.html _site/index.html

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
