name: 活动雷达定时采集

# 定时策略已停用（2026-09-14，R66）：手机端 AlarmManager 精确闹钟比 GitHub 排队调度
# 准时得多（实测 GitHub 午夜延迟可达 2.5 小时以上），定时采集改由手机端承担。
# 本工作流保留「手动触发」能力：Actions 页面 → Run workflow 可随时跑一次云端全量采集
# （用于公网 GitHub Pages 看板补档）。
#
# 如需恢复定时，把下面注释里的 schedule 打开即可：
# on:
#   schedule:
#     - cron: '1 0-15,17-23 * * *'   # 北京时间 01:01~23:01 每小时一次
#     - cron: '30 15 * * *'          # 北京时间 23:30 唤醒 0 点蹲守
on:
  workflow_dispatch: {}            # 仅手动触发 = 立即完整采集一次

permissions:
  contents: write          # 允许把新数据提交回仓库
  pages: write             # 允许发布 GitHub Pages
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 三渠道采集 + 生成看板
        run: python 云采集雷达.py

      - name: 把新数据提交回仓库（留档）
        run: |
          git config user.name  "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "雷达数据更新 $(date -u '+%Y-%m-%d %H:%M') UTC" && git push)

      - name: 组装站点（radar_board.html 作为首页）
        run: |
          mkdir -p _site
          cp assets/radar_board.html _site/index.html

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
