name: GitHub定时极限探测

# ⚠️ 临时探测任务：量化 GitHub Actions「计划触发时刻 vs 实际启动时刻」的延迟（尤其午夜）。
#    测完请删除本文件与仓库里的 _probe_result.md。
# cron 为 UTC；北京时间 = UTC+8。
#   每小时 :00 UTC（= 北京 08:00~次日 07:00，含北京 00:00 那次）
#   北京 23:50 额外跑一次，用于「进程内倒计时到 00:00:00」实测（证明 sleep_until 能卡整点）
on:
  schedule:
    - cron: '0 * * * *'
    - cron: '50 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 记录计划vs实际启动
        run: |
          SCHED="${{ github.event.schedule }}"
          ACTUAL_UTC=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ACTUAL_CN=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S CST')
          LINE="${ACTUAL_CN} | cron=${SCHED} | 实际启动=${ACTUAL_UTC}"
          if [ "$SCHED" = "50 15 * * *" ]; then
            HIT=$(python3 -c "import time; from datetime import datetime,timedelta,timezone; CN=timezone(timedelta(hours=8)); now=datetime.now(CN); t=now.replace(hour=0,minute=0,second=0,microsecond=0); t=t+timedelta(days=1) if now.hour>=12 else t; d=(t-now).total_seconds(); (time.sleep(d) if d>0 else None); print(datetime.now(CN).strftime('%Y-%m-%d %H:%M:%S CST'))")
            LINE="${LINE} | 倒计时实测命中=${HIT}"
          fi
          echo "$LINE" >> _probe_result.md
          {
            echo "### 本次探测"
            echo '```'
            echo "$LINE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交探测记录
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "probe: $(date -u '+%Y-%m-%d %H:%M') UTC" && git pull --rebase && git push)
